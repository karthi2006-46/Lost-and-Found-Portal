name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: SSH and Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 16.170.183.80   # your EC2 IP
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          script: |
            cd Lost-and-Found-Portal
            git pull origin main
            mvn clean package -DskipTests
            pkill -f 'java -jar'
            nohup java -jar target/*.jar > app.log 2>&1 &