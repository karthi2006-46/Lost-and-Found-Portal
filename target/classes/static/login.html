<!DOCTYPE html>
<html>
<head>
  <title>Lost & Found Portal</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <!-- External CSS -->
  <link rel="stylesheet" href="/css/login.css">
</head>

<body>

<!-- ================= NAVBAR ================= -->
<nav class="navbar navbar-expand-lg custom-navbar">
  <div class="container">
    <a class="navbar-brand fw-bold" href="#">
      <i class="fa-solid fa-magnifying-glass-location"></i> Lost & Found
    </a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
      <ul class="navbar-nav">
        <li class="nav-item">
          <a class="nav-link" href="index.html">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="">Report Item</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="index.html">View Items</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="index.html">Contact</a>
        </li>
      </ul>
    </div>
  </div>
</nav>

<!-- ================= LOGIN SECTION ================= -->
<div class="main-section d-flex justify-content-center align-items-center">

  <div class="card login-card shadow-lg p-4">

    <div class="text-center mb-3">
      <h4 class="fw-bold">Lost & Found Portal</h4>
      <small class="text-muted">Secure Login</small>
    </div>

    <!-- LOGIN FORM -->
    <form id="loginForm">
      <div class="input-group mb-2">
        <span class="input-group-text"><i class="fa fa-user"></i></span>
        <input id="username" class="form-control" placeholder="Username" required>
      </div>

      <div class="input-group mb-3">
        <span class="input-group-text"><i class="fa fa-lock"></i></span>
        <input id="password" type="password" class="form-control" placeholder="Password" required>
      </div>

      <button class="btn btn-primary w-100 mb-2">Login</button>

      <div class="text-center mt-3">
  <a href="#" onclick="showRegister()" class="create-link">
    Create New Account
  </a>
</div>
    </form>

    <!-- REGISTER FORM -->
    <form id="registerForm" style="display:none">
      <input id="rname" class="form-control mb-2" placeholder="Full Name" required>
      <input id="rusername" class="form-control mb-2" placeholder="Username" required>
      <input id="remail" class="form-control mb-2" placeholder="Email" required>
      <input id="rpassword" type="password" class="form-control mb-3" placeholder="Password" required>
      <button class="btn btn-success w-100 mb-2">Register</button>
      <div class="text-center">
        <small><a href="#" onclick="showLogin()">Back to Login</a></small>
      </div>
    </form>

  </div>

</div>

<script>

/* =====================
   FORM SWITCH
===================== */
function showRegister(){
  document.getElementById("loginForm").style.display="none";
  document.getElementById("registerForm").style.display="block";
}

function showLogin(){
  document.getElementById("registerForm").style.display="none";
  document.getElementById("loginForm").style.display="block";
}

/* =====================
   LOGIN API
===================== */
document.getElementById("loginForm").addEventListener("submit", async (e)=>{
  e.preventDefault();

  const username = document.getElementById("username").value;
  const password = document.getElementById("password").value;

  try {
    const res = await fetch("/api/auth/login",{
      method:"POST",
      headers:{ "Content-Type":"application/json"},
      body: JSON.stringify({ username, password })
    });

    if(!res.ok){
      alert("Invalid Username or Password");
      return;
    }

    const data = await res.json();

    localStorage.setItem("token", data.token);
    localStorage.setItem("role", data.role);
    localStorage.setItem("username", data.username);

    // Redirect
    if(data.role === "ADMIN"){
      window.location = "/admin-claims.html";
    } else {
      window.location = "/";
    }

  } catch(err){
    alert("Server error. Try again.");
  }
});

/* =====================
   REGISTER API
===================== */
document.getElementById("registerForm").addEventListener("submit", async (e)=>{
  e.preventDefault();

  const fullName = document.getElementById("rname").value;
  const username = document.getElementById("rusername").value;
  const email = document.getElementById("remail").value;
  const password = document.getElementById("rpassword").value;

  try {
    const res = await fetch("/api/auth/register",{
      method:"POST",
      headers:{ "Content-Type":"application/json"},
      body: JSON.stringify({ fullName, username, email, password })
    });

    if(res.ok){
      alert("Account Created Successfully! Please Login.");
      showLogin();
    } else {
      const text = await res.text();
      alert(text || "Registration Failed");
    }

  } catch(err){
    alert("Server error. Try again.");
  }
});

</script>

</body>
</html>
